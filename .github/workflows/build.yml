name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Python embeddable
        run: |
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip" -OutFile "python.zip"
          Expand-Archive -Path "python.zip" -DestinationPath "python" -Force
          Remove-Item "python.zip"

      - name: Enable pip
        run: |
          $content = Get-Content "python\python311._pth" -Raw
          $content = $content -replace '#import site', 'import site'
          Set-Content "python\python311._pth" -Value $content
          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile "python/get-pip.py"
          python\python.exe python/get-pip.py

      - name: Install Python packages
        run: |
          python\python.exe -m pip install --upgrade pip wheel setuptools
          python\python.exe -m pip install pillow psd-tools pandas openpyxl "rembg[cpu]" "onnxruntime>=1.23.2,<2.0.0"
          python\python.exe -c "import PIL; import psd_tools; import rembg; import onnxruntime; print('All packages OK')"

      - name: Copy VCRUNTIME DLLs for portable runtime
        run: |
          # Copy VCRUNTIME DLLs from system to python folder for portable runtime
          # These DLLs are required by onnxruntime on Windows
          $vcruntime = "$env:SystemRoot\System32\vcruntime140.dll"
          $vcruntime1 = "$env:SystemRoot\System32\vcruntime140_1.dll"
          $msvcp140 = "$env:SystemRoot\System32\msvcp140.dll"
          $python311 = "python\python311.dll"
          
          if (Test-Path $vcruntime) { Copy-Item $vcruntime -Destination "python/" -Force }
          if (Test-Path $vcruntime1) { Copy-Item $vcruntime1 -Destination "python/" -Force }
          if (Test-Path $msvcp140) { Copy-Item $msvcp140 -Destination "python/" -Force }
          if (Test-Path $python311) { 
            # python311.dll is already in embeddable, but ensure it's there
            Write-Host "python311.dll already exists"
          }
          Write-Host "VCRUNTIME DLLs copied successfully"
          Get-ChildItem "python/" -Filter "*.dll" | Format-Table Name

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build Electron app
        run: npx electron-builder --win --publish never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Plavoangel-Setup
          path: release/*.exe